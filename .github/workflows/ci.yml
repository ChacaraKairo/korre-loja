name: CI

on:
  push:
    branches: ["main", "agent/**"]
  pull_request:
    branches: ["main"]

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./dev.db
      JWT_SECRET: ci-secret
      ADMIN_SEED_EMAIL: admin@korre.local
      ADMIN_SEED_PASSWORD: change-me
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Prepare database
        run: |
          npm run db:generate
          npm run db:push
          npm run db:seed

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Security audit
        run: npm audit --omit=dev
